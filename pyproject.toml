[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hpcusage"
version = "0.1.0"
description = "Slurm cluster usage reporting: collector, FastAPI backend, Plotly dashboards"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-cas>=1.6,<2",
    "requests>=2.31",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "testcontainers[postgres]>=4.7",
    "httpx>=0.27",
    "responses>=0.25",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app/hpcusage"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
timeout = 300
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["collector", "infra/cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["hpcusage"]
